name: Portfolio quality checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static portfolio
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Validate HTML IDs, anchors and local assets
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote
          import sys

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.links = []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  for key in ("href", "src"):
                      value = attrs.get(key)
                      if value:
                          self.links.append((tag, key, value))

          audit = Audit()
          audit.feed(Path("index.html").read_text(encoding="utf-8"))
          errors = []

          duplicates = sorted({item for item in audit.ids if audit.ids.count(item) > 1})
          if duplicates:
              errors.append("Duplicate HTML IDs: " + ", ".join(duplicates))

          known_ids = set(audit.ids)
          for tag, key, value in audit.links:
              parsed = urlsplit(value)
              if parsed.scheme or value.startswith("//"):
                  continue
              if not parsed.path:
                  if parsed.fragment and parsed.fragment not in known_ids:
                      errors.append(f"Missing page anchor: #{parsed.fragment}")
                  continue
              local_path = Path(unquote(parsed.path))
              if not local_path.exists():
                  errors.append(f"Missing local {key} on <{tag}>: {value}")
              elif parsed.fragment and local_path == Path("index.html") and parsed.fragment not in known_ids:
                  errors.append(f"Missing page anchor: #{parsed.fragment}")

          if errors:
              print("\\n".join(errors))
              sys.exit(1)

          print(f"HTML audit passed: {len(known_ids)} unique IDs and {len(audit.links)} local/external references checked.")
          PY
